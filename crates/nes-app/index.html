<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>replica-NES</title>

    <!-- trunk compila el binario a WebAssembly y genera el código que lo carga. -->
    <link data-trunk rel="rust" data-bin="nes-app" data-wasm-opt="2" />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
        color: #ccc;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="nes-canvas"></canvas>
    <!-- La app elimina este aviso cuando termina de arrancar. -->
    <div id="loading">Cargando replica-NES…</div>
  </body>
</html>
