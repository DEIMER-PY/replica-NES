[workspace]
resolver = "3"
members = ["crates/nes-core", "crates/nes-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/DEIMER-PY/replica-NES"
authors = ["DEIMER-PY"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# El core de emulación es intensivo en CPU: se optimiza también en builds de desarrollo
# para que el emulador corra a velocidad real con `cargo run`. El resto de dependencias
# se deja sin optimizar para que compilar sea rápido.
[profile.dev.package.tetanes-core]
opt-level = 3

[profile.dev.package.nes-core]
opt-level = 3

[profile.dev]
debug = "line-tables-only"

# Perfil de publicación: todo lo que el compilador puede dar, a costa de compilar más lento.
# Medido con `cargo run -p nes-core --release --example bench`: LTO completo y `panic = "abort"`
# emulan un 16 % más rápido que LTO "thin".
[profile.release]
lto = "fat"          # optimiza a través de todos los crates como si fueran uno
codegen-units = 1    # una sola unidad: más oportunidades de inlining
panic = "abort"      # sin tablas de desenrollado: código más pequeño y directo
strip = true         # ejecutable sin símbolos de depuración
